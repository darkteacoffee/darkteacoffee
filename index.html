<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>一日</title>
<meta name="description" content="打开就写，日期自动。">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#100f0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="bg-photo" aria-hidden="true"></div>

<div id="boot" class="boot">
  <div class="boot-mark">一日</div>
</div>

<main id="view" class="view" aria-live="polite"></main>

<nav id="tabbar" class="tabbar" aria-label="主导航">
  <button class="tab" data-route="today" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="M14.5 6.5l3 3"/></svg>
    <span>今天</span>
  </button>
  <button class="tab" data-route="calendar" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg>
    <span>日历</span>
  </button>
  <button class="tab" data-route="search" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
    <span>搜索</span>
  </button>
  <button class="tab" data-route="review" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9L12 3.5Z"/><path d="M18.5 16.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"/></svg>
    <span>回顾</span>
  </button>
</nav>

<div id="toast-wrap" class="toast-wrap" aria-live="assertive"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
